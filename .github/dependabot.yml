# Opens a weekly pull request when a dependency or GitHub Action has a new version, and right away for security
# advisories. Everything here is a dev dependency, but Electron is the runtime shipped inside the app, so its patch
# releases (Chromium/V8 security fixes) matter to users.
# Before merging an Electron bump: npm run lint && npm test && npm run self-test, and add a CHANGELOG line.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ESLint and its helpers move together.
      lint:
        patterns: ["eslint", "@eslint/*", "globals"]

  # Actions are pinned by commit SHA; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
